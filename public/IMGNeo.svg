<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#bg)" rx="12"/>

  <!-- Decorative grid lines -->
  <line x1="0" y1="60" x2="400" y2="60" stroke="rgba(168,85,247,0.1)" stroke-width="1"/>
  <line x1="0" y1="120" x2="400" y2="120" stroke="rgba(168,85,247,0.1)" stroke-width="1"/>
  <line x1="0" y1="180" x2="400" y2="180" stroke="rgba(168,85,247,0.1)" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="240" stroke="rgba(168,85,247,0.1)" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="240" stroke="rgba(168,85,247,0.1)" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="240" stroke="rgba(168,85,247,0.1)" stroke-width="1"/>

  <!-- Glow circle -->
  <circle cx="200" cy="105" r="70" fill="rgba(168,85,247,0.06)"/>

  <!-- NEO title -->
  <text x="200" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="800" text-anchor="middle" fill="url(#accent)" filter="url(#glow)" letter-spacing="8">NEO</text>

  <!-- Subtitle -->
  <text x="200" y="110" font-family="'Segoe UI', Arial, sans-serif" font-size="13" text-anchor="middle" fill="rgba(255,255,255,0.6)" letter-spacing="3">HOT SALE LANDING PAGE</text>

  <!-- Divider -->
  <rect x="140" y="122" width="120" height="2" fill="url(#accent)" rx="1"/>

  <!-- Tech badges -->
  <!-- Next.js badge -->
  <rect x="42" y="142" width="72" height="24" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="78" y="159" font-family="'Segoe UI', Arial, sans-serif" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.85)">Next.js 15</text>

  <!-- TypeScript badge -->
  <rect x="124" y="142" width="72" height="24" rx="6" fill="rgba(59,130,246,0.2)" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
  <text x="160" y="159" font-family="'Segoe UI', Arial, sans-serif" font-size="11" text-anchor="middle" fill="#60a5fa">TypeScript</text>

  <!-- Tailwind badge -->
  <rect x="206" y="142" width="72" height="24" rx="6" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.4)" stroke-width="1"/>
  <text x="242" y="159" font-family="'Segoe UI', Arial, sans-serif" font-size="11" text-anchor="middle" fill="#22d3ee">Tailwind 4</text>

  <!-- MercadoPago badge -->
  <rect x="288" y="142" width="72" height="24" rx="6" fill="rgba(0,180,255,0.12)" stroke="rgba(0,180,255,0.3)" stroke-width="1"/>
  <text x="324" y="159" font-family="'Segoe UI', Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7dd3fc">MercadoPago</text>

  <!-- GitHub label -->
  <rect x="150" y="192" width="100" height="26" rx="8" fill="rgba(168,85,247,0.2)" stroke="rgba(168,85,247,0.5)" stroke-width="1"/>
  <text x="200" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="11" text-anchor="middle" fill="#d8b4fe" letter-spacing="1">Ver en GitHub →</text>
</svg>
